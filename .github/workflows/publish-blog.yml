name: Publish Blog Posts from Firestore & Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-blog]

permissions:
  contents: write

concurrency:
  group: dreamhost-build
  cancel-in-progress: true

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Published Blog Posts from Firestore
        run: npm run sync-blog

      - name: Commit Updated blogPosts.json to Master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blogPosts.json
          if git diff --staged --quiet; then
            echo "blogPosts.json already matches Firestore — proceeding with static verify/deploy."
          else
            git commit -m "content(blog): sync published articles from Admin Portal [skip ci]"
            git push origin master
          fi

      - name: Build Static Site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check the export is built for the domain root
        run: |
          test -f out/index.html
          if grep -q '/insidermortgage/' out/index.html; then
            echo "::error::out/index.html still uses the /insidermortgage basePath; remove basePath from next.config.mjs"
            exit 1
          fi

      - name: Publish to the dreamhost-build branch
        working-directory: out
        run: |
          if [ -f .htaccess ]; then mv .htaccess htaccess.from-build; fi
          MASTER_SHA=$(git -C .. rev-parse --short=8 HEAD)
          git init -q -b dreamhost-build
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Build of master ${MASTER_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:dreamhost-build
