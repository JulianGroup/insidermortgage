name: Sync US 10-Year T-Note Daily Session Log

# Scheduled authenticated sync now runs in Firebase Cloud Functions (`syncUs10YrDailyLog`).
# Keep manual dispatch available here for ad-hoc maintenance if needed.
on:
  workflow_dispatch:

jobs:
  sync-us10yr-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync US 10-Year T-Note Daily Log to Firestore
        run: node scripts/sync-us10yr-daily-log.mjs
