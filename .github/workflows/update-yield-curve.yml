name: Auto-Update Yield Curve Data & Deploy

on:
  schedule:
    # Runs at 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-yield-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Latest FRED Yield Curve Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run update-data

      - name: Commit and Push Updated Data to Master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/yieldCurveData.json
          if git diff --staged --quiet; then
            echo "Yield curve data is already up to date."
          else
            git commit -m "chore(data): auto-update yield curve dataset [skip ci]"
            git push origin master
          fi

      - name: Build Static Site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check the export is built for the domain root
        run: |
          test -f out/index.html
          if grep -q '/insidermortgage/' out/index.html; then
            echo "::error::out/index.html still uses the /insidermortgage basePath; remove basePath from next.config.mjs"
            exit 1
          fi

      - name: Publish to the dreamhost-build branch
        working-directory: out
        run: |
          MASTER_SHA=$(git -C .. rev-parse --short=8 HEAD)
          git init -q -b dreamhost-build
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Build of master ${MASTER_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:dreamhost-build
